<!DOCTYPE html>
<html>
  <head>
    <title>Portifólio de Fotos </title>
  </head>
  <body>
    <h1>Meu Portifólio</h1>
    <h2>Galeria de Fotos</h2>
    <figure>
      <img src="img/ceu.jpeg" alt="Céu e serras maranguapenses" width="200"><br>
      <figcaption>
        Figura 1: Fotografia do céu e serras do IFCE Campus Maranguape.
      </figcaption>
    </figure>

    <figure>
      <img src="img/cogumelo.jpg" alt="Cogumelo" width="200"><br>
      <figcaption>
        Figura 2: Fotografia de um cogumelo crescendo em toco de árvore.
      </figcaption>
    </figure>

    <figure>
      <img src="img/plantas.jpg" alt="Árvores e raios solares" width="200"><br>
      <figcaption>
        Figura 3: Fotografia de árvores vistas de cima com raios solares.
      </figcaption>
    </figure>

    <figure>
      <img src="img/flor.jpg" alt="Flores vermelhas com gotículas de água" width="200"><br>
      <figcaption>
        Figura 1: Fotografia de flores vermelhas com gotículas de água após chuva.
      </figcaption>
    </figure>
  </body>
</html>
